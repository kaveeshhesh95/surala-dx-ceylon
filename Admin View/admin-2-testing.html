<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中学数学 ドリルコース - テスト追加</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #333333;
      padding: 24px;
      font-size: 12px;
    }

    .container {
      max-width: 750px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 4px;
    }

    /* Top Breadcrumb Navigation */
    .breadcrumb {
      font-size: 13px;
      color: #333333;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Radio Group */
    .radio-group {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Filter Outer Panel */
    .filter-panel {
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 20px;
    }

    /* Top Dropdowns Grid */
    .dropdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .select-group label {
      font-weight: bold;
      color: #374151;
      font-size: 11px;
    }

    .select-group select {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 11px;
      color: #374151;
      background-color: #ffffff;
      outline: none;
      cursor: pointer;
    }

    /* Middle Inputs Row */
    .middle-grid {
      display: grid;
      grid-template-columns: 1fr 3fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .search-input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .search-input-group label {
      font-weight: bold;
      color: #374151;
      font-size: 11px;
    }

    .search-input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 11px;
      color: #9ca3af;
      outline: none;
    }

    /* Filter Bottom Controls */
    .filter-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .checkbox-group {
      display: flex;
      gap: 16px;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #4b5563;
    }

    .checkbox-group input[type="checkbox"] {
      accent-color: #6366f1;
      width: 15px;
      height: 15px;
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    .btn-reset {
      background-color: #9ca3af;
      color: #ffffff;
      border: none;
      padding: 6px 20px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-search {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 6px 20px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Data Table */
    .table-container {
      border: 1px solid #d1d5db;
      border-radius: 2px;
      background-color: #ffffff;
    }

    .table-header {
      display: grid;
      grid-template-columns: 1fr 2.5fr 2fr 1.2fr;
      background-color: #e5e7eb;
      padding: 10px 16px;
      font-weight: bold;
      color: #4b5563;
      border-bottom: 1px solid #d1d5db;
      font-size: 11px;
    }

    .header-cell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-right: 8px;
    }

    .sort-icon {
      color: #6b7280;
      font-size: 9px;
      line-height: 1;
    }

    .table-body {
      max-height: 240px;
      overflow-y: auto;
    }

    .table-row {
      display: grid;
      grid-template-columns: 1fr 2.5fr 2fr 1.2fr;
      padding: 10px 16px;
      border-bottom: 1px dashed #d1d5db;
      align-items: center;
      font-size: 11px;
      color: #374151;
    }

    .table-row:last-child {
      border-bottom: none;
    }

    /* Bottom Action */
    .footer-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn-submit {
      background-color: #6366f1;
      color: #ffffff;
      border: none;
      padding: 10px 32px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Breadcrumb -->
    <div class="breadcrumb">
      <span>中学数学 ドリルコース</span>
      <span>&gt;</span>
      <span>Stage5 正負の数・文字を使った...</span>
      <span>&gt;</span>
    </div>

    <!-- Navigation Options -->
    <div class="radio-group">
      <label><input type="radio" name="addition_type"> ステージ追加</label>
      <label><input type="radio" name="addition_type"> レッスン追加</label>
      <label><input type="radio" name="addition_type"> ユニット追加</label>
      <label><input type="radio" name="addition_type"> 教科書追加</label>
      <label><input type="radio" name="addition_type" checked> テスト追加</label>
    </div>

    <!-- Filter Panel -->
    <div class="filter-panel">
      <!-- 4 Top Select Inputs -->
      <div class="dropdown-grid">
        <div class="select-group">
          <label>テストカテゴリ</label>
          <select>
            <option>学力診断テスト</option>
          </select>
        </div>
        <div class="select-group">
          <label>教科</label>
          <select>
            <option>数学</option>
          </select>
        </div>
        <div class="select-group">
          <label>学年</label>
          <select>
            <option>中学1年生</option>
          </select>
        </div>
        <div class="select-group">
          <label>学期</label>
          <select>
            <option>1学期</option>
          </select>
        </div>
      </div>

      <!-- Middle Inputs -->
      <div class="middle-grid">
        <div class="select-group">
          <label>偏差値</label>
          <select>
            <option>あり</option>
          </select>
        </div>
        <div class="search-input-group">
          <label>テスト名</label>
          <input 
            type="text" 
            class="search-input" 
            value="検索対象カラム：テストID／テスト名" 
          />
        </div>
      </div>

      <!-- Controls & Checkboxes -->
      <div class="filter-controls">
        <div class="checkbox-group">
          <label><input type="checkbox" checked> 非表示も含めて表示する</label>
          <label><input type="checkbox" checked> 対象ユニットと紐付きのないテストのみ表示</label>
        </div>
        <div class="button-group">
          <button class="btn-reset">リセット</button>
          <button class="btn-search">検索</button>
        </div>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-container">
      <div class="table-header">
        <div class="header-cell"><span>テストID</span><span class="sort-icon">▲<br>▼</span></div>
        <div class="header-cell"><span>テスト名</span><span class="sort-icon">▲<br>▼</span></div>
        <div class="header-cell"><span>テストカテゴリ</span><span class="sort-icon">▲<br>▼</span></div>
        <div class="header-cell"><span>表示設定</span><span class="sort-icon">▲<br>▼</span></div>
      </div>

      <div class="table-body">
        <div class="table-row">
          <span>XXXXXXX</span>
          <span>中1 学力診断テスト...</span>
          <span>学力診断テスト</span>
          <span>表示</span>

        <div class="table-row">
          <span>XXXXXXX</span>

          <span>表示</span>
        </div>

        <div class="table-row">
          <span>XXXXXXX</span>
          <span>中1 学力診断テスト...</span>
          <span>学力診断テスト</span>
          <span>表示</span>
        </div>

        <div class="table-row">
          <span>XXXXXXX</span>
          <span>中1 学力診断テスト...</span>
          <span>学力診断テスト</span>
          <span>表示</span>
        </div>

        <div class="table-row">
          <span>XXXXXXX</span>
          <span>中1 学力診断テスト...</span>
          <span>学力診断テスト</span>
          <span>表示</span>
        </div>

        <div class="table-row">
          <span>XXXXXXX</span>
          <span>中1 学力診断テスト...</span>
          <span>学力診断テスト</span>
          <span>表示</span>
        </div>
      </div>
    </div>

    <!-- Footer Action -->
    <div class="footer-actions">
      <button class="btn-submit">紐付を設定する</button>
    </div>
  </div>

</body>
</html>
