<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユニット紐付機能 UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      padding: 20px 40px;
      color: #333333;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 24px;
      gap: 32px;
      font-size: 13px;
    }

    .tab-item {
      padding: 8px 0 12px 0;
      color: #4b5563;
      cursor: pointer;
      position: relative;
      text-decoration: none;
    }

    .tab-item.active {
      color: #6366f1;
      font-weight: bold;
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: #6366f1;
      border-radius: 2px 2px 0 0;
    }

    /* Primary Select Control */
    .selector-container {
      margin-bottom: 20px;
    }

    .custom-select {
      position: relative;
      display: inline-block;
      width: 240px;
    }

    .custom-select select {
      width: 100%;
      padding: 8px 32px 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 14px;
      color: #374151;
      appearance: none;
      -webkit-appearance: none;
      background-color: #ffffff;
      cursor: pointer;
    }

    .custom-select::after {
      content: "▼";
      font-size: 10px;
      color: #9ca3af;
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    /* Filter Box Panel */
    .filter-panel {
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 20px 24px;
      margin-bottom: 24px;
      background-color: #ffffff;
    }

    .form-grid {
      display: flex;
      gap: 32px;
      margin-bottom: 20px;
    }

    .form-group {
      flex: 1;
      max-width: 320px;
    }

    .form-label {
      font-size: 14px;
      font-weight: bold;
      color: #374151;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
    }

    .required-badge {
      color: #ef4444;
      margin-left: 4px;
    }

    .filter-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #374151;
      cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #6366f1;
      border-radius: 3px;
    }

    .btn-submit {
      background-color: #1d4ed8;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 8px 32px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1e40af;
    }

    /* Table Component */
    .table-container {
      border: 1px solid #d1d5db;
      border-radius: 2px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      background-color: #e5e7eb;
      color: #4b5563;
      font-weight: bold;
      padding: 10px 16px;
      text-align: center;
      border-bottom: 1px solid #d1d5db;
    }

    th:nth-child(1) { width: 22%; text-align: left; }
    th:nth-child(2) { width: 28%; text-align: left; }
    th:nth-child(3) { width: 50%; text-align: left; }

    td {
      border: 1px solid #e5e7eb;
      padding: 0;
      vertical-align: middle;
      background-color: #ffffff;
    }

    .cell-course {
      padding: 16px;
      font-size: 12px;
      position: relative;
    }

    .btn-add-inline {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border: 1px solid #9ca3af;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #6b7280;
    }

    /* Direction Control Buttons */
    .direction-btns {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .btn-arrow {
      width: 28px;
      height: 24px;
      border: 1px solid #9ca3af;
      background: #ffffff;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #4b5563;
    }

    .btn-arrow:hover, .btn-action-icon:hover, .btn-add-inline:hover {
      background-color: #f3f4f6;
    }

    .btn-action-icon {
      border: none;
      background: transparent;
      cursor: pointer;
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    /* Sub-row Layouts inside Table Cells */
    .unit-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .unit-row:last-child {
      border-bottom: none;
    }

    .unit-title {
      flex: 1;
      font-size: 12px;
      color: #374151;
    }

    .unit-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .content-row {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      gap: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .content-row:last-child {
      border-bottom: none;
    }

    .content-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
    }

    .content-name {
      color: #4b5563;
    }

    .content-subtext {
      color: #6b7280;
    }

    /* SVG Icon styles */
    .trash-icon {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .plus-circle-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }
  </style>
</head>
