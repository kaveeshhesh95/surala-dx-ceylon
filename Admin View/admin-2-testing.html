<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Textbook Unit Management UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #333333;
      padding: 24px;
      font-size: 13px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Breadcrumb */
    .breadcrumb {
      font-size: 12px;
      color: #666666;
      margin-bottom: 16px;
    }
    .breadcrumb span {
      margin-left: 4px;
    }

    /* Top Radio Group */
    .radio-group {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-weight: bold;
      font-size: 13px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Filter Box */
    .filter-card {
      border: 1px solid #dcdcdc;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 24px;
      background-color: #ffffff;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 16px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-weight: bold;
      font-size: 11px;
      color: #333333;
    }

    .form-control {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #dcdcdc;
      border-radius: 4px;
      background-color: #ffffff;
      font-size: 13px;
      color: #333333;
      outline: none;
    }

    select.form-control {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23666666%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 9px;
      padding-right: 24px;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .search-input-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .search-input-group label {
      font-weight: bold;
      font-size: 11px;
      color: #333333;
    }

    .btn {
      height: 36px;
      padding: 0 24px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-reset {
      background-color: #a6a6a6;
      color: #ffffff;
      margin-top: 18px;
    }

    .btn-search {
      background-color: #1a73e8;
      color: #ffffff;
      margin-top: 18px;
    }

    /* Checkbox */
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: bold;
      color: #333333;
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: #6f42c1;
      width: 16px;
      height: 16px;
      border-radius: 3px;
    }

    /* Data Table */
    .table-container {
      border: 1px solid #dcdcdc;
      border-radius: 2px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 12px;
    }

    thead {
      background-color: #e0e0e0;
      color: #333333;
    }

    th {
      padding: 10px 12px;
      font-weight: bold;
      white-space: nowrap;
      border-right: 1px solid #dcdcdc;
    }

    th:last-child {
      border-right: none;
    }

    th .sort-icon {
      font-size: 9px;
      margin-left: 4px;
      color: #666666;
    }

    tbody tr {
      border-top: 1px dashed #dcdcdc;
    }

    td {
      padding: 10px 12px;
      color: #333333;
    }

    /* Selected Row Highlight */
    tbody tr.selected {
      background-color: #fce4d6;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="breadcrumb">
      中学数学 教科書単元 <span>&gt;</span>
    </div>

    <div class="radio-group">
      <label><input type="radio" name="unit_type"> ステージ追加</label>
      <label><input type="radio" name="unit_type"> レッスン追加</label>
      <label><input type="radio" name="unit_type"> ユニット追加</label>
      <label><input type="radio" name="unit_type" checked> 教科書追加</label>
      <label><input type="radio" name="unit_type"> テスト追加</label>
    </div>

    <div class="filter-card">
      <div class="form-grid">
        <div class="form-group">
          <label>出版社</label>
          <select class="form-control">
            <option>東京書籍</option>
          </select>
        </div>
        <div class="form-group">
          <label>教科</label>
          <select class="form-control">
            <option>算数・数学</option>
          </select>
        </div>
        <div class="form-group">
          <label>科目</label>
          <select class="form-control">
            <option>数学 I</option>
          </select>
        </div>
        <div class="form-group">
          <label>学年</label>
          <select class="form-control">
            <option>高校1年</option>
          </select>
        </div>
      </div>

      <div class="search-row">
        <div class="search-input-group">
          <label>出版社・教科書</label>
          <input type="text" class="form-control" placeholder="検索対象カラム：教科書ID／教科書名／出版社ID／出版社名">
        </div>
        <button class="btn btn-reset">リセット</button>
        <button class="btn btn-search">検索</button>
      </div>

      <label class="checkbox-label">
        <input type="checkbox" checked> 非表示も含めて表示する
      </label>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>教科書 <span class="sort-icon">▲▼</span></th>
            <th>出版社 <span class="sort-icon">▲▼</span></th>
            <th>教科 <span class="sort-icon">▲▼</span></th>
            <th>科目 <span class="sort-icon">▲▼</span></th>
            <th>対象学年 <span class="sort-icon">▲▼</span></th>
            <th>表示設定 <span class="sort-icon">▲▼</span></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>新しい数学</td>
            <td>東京書籍</td>
            <td>算数・数学</td>
            <td>数学 I</td>
            <td>高校</td>
            <td>表示</td>
          </tr>
          <tr>
            <td>新しい数学</td>
            <td>東京書籍</td>
            <td>算数・数学</td>
            <td>数学 I</td>
            <td>高校</td>
            <td>表示</td>
          </tr>
          <tr>
            <td>新しい数学</td>
            <td>東京書籍</td>
            <td>算数・数学</td>
            <td>数学 I</td>
            <td>高校</td>
            <td>表示</td>
          </tr>
          <tr class="selected">
            <td>新しい数学</td>
            <td>東京書籍</td>
            <td>算数・数学</td>
            <td>数学 I</td>
            <td>高校</td>
            <td>表示</td>
          </tr>
          <tr>
            <td>新しい数学</td>
            <td>東京書籍</td>
            <td>算数・数学</td>
            <td>数学 I</td>
            <td>高校</td>
            <td>表示</td>
          </tr>
          <tr>
            <td>新しい数学</td>
            <td>東京書籍</td>
            <td>算数・数学</td>
            <td>数学 I</td>
            <td>高校</td>
            <td>表示</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
