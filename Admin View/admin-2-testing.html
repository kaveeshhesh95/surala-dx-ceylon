<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal Dialog</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Modal Container */
    .modal-container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 800px;
      padding: 24px;
      position: relative;
    }

    /* Close Icon Header */
    .close-icon {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-size: 20px;
      color: #666;
      cursor: pointer;
    }

    /* Header Title */
    .modal-header h2 {
      font-size: 20px;
      font-weight: 700;
      color: #222;
      margin-bottom: 16px;
    }

    /* Notes Section */
    .modal-notes {
      font-size: 12px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* Table Styling */
    .table-wrapper {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      border-top: 3px solid #66bb6a; /* Green top accent line */
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 13px;
    }

    thead {
      background-color: #f7f9fa;
      border-bottom: 1px solid #e0e0e0;
    }

    th, td {
      padding: 12px 8px;
      border-bottom: 1px solid #e0e0e0;
      border-right: 1px solid #f0f0f0;
      color: #333;
    }

    th:last-child, td:last-child {
      border-right: none;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Buttons */
    .btn-action {
      background-color: #7d7d7d;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-action:hover {
      background-color: #666666;
    }

    .btn-close {
      background-color: #7d7d7d;
      color: #ffffff;
      border: none;
      padding: 8px 28px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-close:hover {
      background-color: #666666;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-start;
    }
  </style>
</head>
<body>

  <div class="modal-container">
    <button class="close-icon">&times;</button>
    
    <div class="modal-header">
      <h2>レクチャー1 正負の数の加法・減法</h2>
    </div>

    <div class="modal-notes">
      <p>※ 回数 : 問題を「もう一回チャレンジ」で解答した際にカウントアップされます。</p>
      <p>※ 同じ問題の解答回数 : 問題を再度表示し、解答した際にカウントアップされます。</p>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ページ</th>
            <th>問題番号</th>
            <th>回数</th>
            <th>同じ問題の解答回数</th>
            <th>解答</th>
            <th>判定</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>6</td>
            <td>1</td>
            <td>1</td>
            <td>1</td>
            <td>q1dragItem1,q1dragItem2,q1dragItem3,q1dragItem4</td>
            <td>✕</td>
            <td><button class="btn-action">解答を見る</button></td>
          </tr>
          <tr>
            <td>7</td>
            <td>1</td>
            <td>1</td>
            <td>1</td>
            <td>たまご</td>
            <td>◯</td>
            <td><button class="btn-action">解答を見る</button></td>
          </tr>
          <tr>
            <td>8</td>
            <td>1</td>
            <td>1</td>
            <td>1</td>
            <td>option_3</td>
            <td>✕</td>
            <td><button class="btn-action">解答を見る</button></td>
          </tr>
          <tr>
            <td>9</td>
            <td>1</td>
            <td>1</td>
            <td>1</td>
            <td>option_2</td>
            <td>◯</td>
            <td><button class="btn-action">解答を見る</button></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="modal-footer">
      <button class="btn-close">閉じる</button>
    </div>
  </div>

</body>
</html>
