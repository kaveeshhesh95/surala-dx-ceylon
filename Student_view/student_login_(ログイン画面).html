                item.classList.add('active');
                document.getElementById('sec-settings-' + item.dataset.target).classList.add('active');
            });
        });

        document.querySelectorAll('.pw-eye').forEach(function (eye) {
            eye.addEventListener('click', function () {
                var input = document.getElementById(eye.dataset.target);
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                eye.classList.toggle('fa-eye', !show);
                eye.classList.toggle('fa-eye-slash', show);
            });
        });

        (function () {
            var pwNew = document.getElementById('st-pw-new');
            var bar = document.getElementById('st-pw-strength-bar');
            var label = document.getElementById('st-pw-strength-label');
            if (!pwNew) return;
            pwNew.addEventListener('input', function () {
                var v = pwNew.value;
                var score = 0;
                if (v.length >= 8) score++;
                if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
                if (/[0-9]/.test(v)) score++;
                if (/[^A-Za-z0-9]/.test(v)) score++;
                var pct = v.length === 0 ? 0 : (score / 4) * 100;
                var colors = ['#ef4444', '#ef4444', '#f59e0b', '#f59e0b', '#10b981'];
                var labels = ['ー', 'よわい', 'ふつう', 'つよい', 'とてもつよい'];
                bar.style.width = pct + '%';
                bar.style.background = colors[score];
                label.textContent = '強度：' + (v.length === 0 ? 'ー' : labels[score]);
            });
        })();

        document.getElementById('st-pw-form').addEventListener('submit', function (e) {
            e.preventDefault();
            var cur = document.getElementById('st-pw-current').value;
            var n1 = document.getElementById('st-pw-new').value;
            var n2 = document.getElementById('st-pw-confirm').value;
            var msg = document.getElementById('st-pw-msg');
            if (!cur || !n1 || !n2) {
                msg.style.color = 'var(--danger)';
                msg.textContent = 'すべての項目を入力してください。';
                return;
            }
            if (n1 !== n2) {
                msg.style.color = 'var(--danger)';
                msg.textContent = '新しいパスワードが一致しません。';
                return;
            }
            msg.style.color = 'var(--ok)';
            msg.textContent = 'パスワードを変更しました。';
        });
    </script>

        function tsRenderTestList() {

                    '<th style="width:140px; text-align:center;" data-sort-key="history"><ruby>受験履歴<rt>じゅけんりれき</rt></ruby></th>' +
                    '<th style="width:100px;"></th>' +
                    '</tr>';

                var selGrade = tsGkGradeEl ? tsGkGradeEl.value : 'h2';
                var selSubj = tsGkSubjEl ? tsGkSubjEl.value : 'all';

                var sourceData = (TS_TYPE === 'pre') ? PRE_TEST_DATA : GK_TEST_DATA;

                var filteredList = sourceData.filter(function (item) {
                    var gradeOk = (selGrade === 'all' || item.grade === selGrade);
                    var subjOk = (selSubj === 'all' || item.subj === selSubj);
                    return gradeOk && subjOk;
                });

                if (!filteredList.length) {
                    var testTypeName = (TS_TYPE === 'pre') ? '単元別プレテスト' : '学力診断テスト';
                    tbody.innerHTML = '<tr><td colspan="6" class="hint-empty">選択した条件の' + testTypeName + 'はありません</td></tr>';
                    tsInitSort();
                    return;
                }

                filteredList.forEach(function (item) {
                    var tr = document.createElement('tr');
                    tr.classList.add('is-visible');
                    var isDone = item.history !== '未受験';
                    var scoreMatch = item.history.match(/(\d+)点/);
                    var scoreVal = scoreMatch ? parseInt(scoreMatch[1], 10) : -1;
                    tr.setAttribute('data-grade', item.gradeLabel);
                    tr.setAttribute('data-subj-label', item.subjLabel);
                    tr.setAttribute('data-name', item.name);
                    tr.setAttribute('data-time', item.time);
                    tr.setAttribute('data-history', isDone ? scoreVal : -1);
                    var historyHtml = isDone

                    tr.innerHTML =

                        '<td style="font-weight:700; color:var(--text-main);">' + item.name + '</td>' +
                        '<td style="text-align:center; font-weight:700;">' + item.time + '</td>' +
                        '<td style="text-align:center;">' + historyHtml + '</td>' +
                        '<td><button class="btn btn-dark" onclick="showPage(\'test-study\')">テストを受ける</button></td>';

                    tbody.appendChild(tr);
                });


            } else {
                thead.innerHTML =
                    '<tr>' +
                    '<th style="width:70px;">種別</th>' +
                    '<th data-sort-key="name">テスト名 / 対象単元</th>' +
                    '<th style="width:110px; text-align:center;">問題数 / 時間</th>' +
                    '<th style="width:80px;" data-sort-key="score">最高得点</th>' +
                    '<th style="width:80px;" data-sort-key="status">状態</th>' +
                    '<th style="width:100px;"></th>' +
                    '</tr>';

                var subjCode = tsGetActiveSubject();
                var gradeCode = tsGetActiveGrade();

                var stages = (SULALA_TREE[subjCode] && SULALA_TREE[subjCode][gradeCode]) || [];
                var names = TEST_NAMES[TS_TYPE] || TEST_NAMES.surala;

                if (!stages.length) {
                    tbody.innerHTML = '<tr><td colspan="6" class="hint-empty">この教科・学年のテストデータはありません</td></tr>';
                    tsInitSort();
                    return;
                }

                names.forEach(function (namePattern, idx) {
                    var stage = stages[idx % stages.length];
                    var lesson = stage.lessons[0];
                    var tr = document.createElement('tr');
                    tr.classList.add('is-visible');

                    var score = (idx === 0) ? '100点' : (idx === 1 ? '85点' : '未受験');
                    var scoreVal = (idx === 0) ? 100 : (idx === 1 ? 85 : -1);
                    var statusHtml = (idx === 0) ? CLEAR_TAG_HTML : (idx === 1 ? '<span style="color:var(--ok);font-weight:700;">完了</span>' : '<span style="color:var(--text-sub);font-weight:600;">未テスト</span>');
                    var statusRank = (idx === 0) ? 2 : (idx === 1 ? 1 : 0);
                    tr.setAttribute('data-name', namePattern + stage.name + lesson.name);
                    tr.setAttribute('data-score', scoreVal);
                    tr.setAttribute('data-status', statusRank);

                    tr.innerHTML =
                        '<td><svg class="icon-pict"><use href="#icon-pencil"/></svg><br><span style="font-size:10px;color:var(--text-sub);">テスト</span></td>' +
                        '<td>' +
                        '<div class="unit-cell-row">' +
                        '<span class="tag ' + subjCode + '">' + BAND_LABEL[gradeCode] + ' ' + SUBJ_LABEL[subjCode] + '</span>' +
                        '<span class="unit-cell-sub">' + stage.name + '</span>' +
                        '<span class="unit-cell-main">' + namePattern + ' (' + lesson.name + ')</span>' +
                        '</div>' +
                        '</td>' +
                        '<td style="text-align:center;">10問 / 15分</td>' +
                        '<td style="font-weight:700;font-size:0.9rem;color:var(--teal);">' + score + '</td>' +
                        '<td>' + statusHtml + '</td>' +
                        '<td><button class="btn btn-dark" onclick="showPage(\'test-study\')">テストを受ける</button></td>';

                    tbody.appendChild(tr);
                });
            }
            tsInitSort();
        }

        function tsInitSort() {
            var table = document.getElementById('ts-test-table');
            if (!table) return;
            var isGkPre = (TS_TYPE === 'gakuryoku' || TS_TYPE === 'pre');
            initMultiSortTable(table, {
                getTbody: function () { return document.getElementById('ts-test-body'); },
                getRows: function () { return Array.from(document.getElementById('ts-test-body').querySelectorAll('tr')); },
                columns: isGkPre ? {
                    grade: { type: 'text', getValue: function (tr) { return tr.getAttribute('data-grade') || ''; } },
                    subj: { type: 'text', getValue: function (tr) { return tr.getAttribute('data-subj-label') || ''; } },
                    name: { type: 'text', getValue: function (tr) { return tr.getAttribute('data-name') || ''; } },
                    time: { type: 'text', getValue: function (tr) { return tr.getAttribute('data-time') || ''; } },
                    history: { type: 'number', getValue: function (tr) { return parseFloat(tr.getAttribute('data-history')) || 0; } }
                } : {
                    name: { type: 'text', getValue: function (tr) { return tr.getAttribute('data-name') || ''; } },
                    score: { type: 'number', getValue: function (tr) { return parseFloat(tr.getAttribute('data-score')) || 0; } },
                    status: { type: 'number', getValue: function (tr) { return parseFloat(tr.getAttribute('data-status')) || 0; } }

                    getRows: function () { return Array.from(document.getElementById('ts-history-body').querySelectorAll('tr')); },

                        col1: { type: 'text', getValue: function (tr) { return tr.children[1].textContent.trim(); } },
                        col2: { type: 'text', getValue: function (tr) { return tr.children[2].textContent.trim(); } },
                        col3: { type: 'text', getValue: function (tr) { return tr.children[3].textContent.trim(); } },
                        col4: { type: 'text', getValue: function (tr) { return tr.children[4].textContent.trim(); } },
                        col5: { type: 'text', getValue: function (tr) { return tr.children[5].textContent.trim(); } },
                        col6: { type: 'number', getValue: function (tr) { return parseFloat(tr.children[6].textContent) || 0; } }
                    }
                });
            }
        });

    <script>
        /* ============ テスト終了 → テスト結果画面 ============ */
        function finishTest() {
            // 実際の実装では、ここで解答を採点しテスト結果データを取得する
            trSetResultOrigin('test');
            showPage('test-result');
            trSwitchTab('question');
        }

        /* ============ テスト履歴 → 成績詳細 → テスト結果画面 ============ */
        function trOpenResultFromHistory() {
            trSetResultOrigin('history');
            showPage('test-result');
            trSwitchTab('question');
        }

        function trSetResultOrigin(origin) {
            var breadcrumb = document.getElementById('tr-breadcrumb');
            var backBtn = document.getElementById('tr-back-btn');
            if (origin === 'history') {
                if (breadcrumb) {
                    breadcrumb.innerHTML =
                        '学習メニュー &gt; <a href="javascript:void(0)" onclick="showPage(\'test\')">テスト</a> &gt; ' +
                        '<a href="javascript:void(0)" onclick="showTestHistory()">テスト履歴</a> &gt; テスト結果詳細';
                }
                if (backBtn) {
                    backBtn.textContent = 'テスト履歴へ戻る';
                    backBtn.setAttribute('onclick', 'showTestHistory()');
                }
            } else {
                if (breadcrumb) {
                    breadcrumb.innerHTML = '学習メニュー &gt; <a href="javascript:void(0)" onclick="showPage(\'test\')">テスト</a> &gt; テスト結果詳細';
                }
                if (backBtn) {
                    backBtn.textContent = 'テスト一覧へ戻る';
                    backBtn.setAttribute('onclick', "showPage('test')");
                }
            }
        }

        function showTestHistory() {
            showPage('test');
            tsSwitchTab('history');
        }

        function trSwitchTab(type) {
            var tabs = { question: 'tr-tab-question', unit: 'tr-tab-unit', tangen: 'tr-tab-tangen' };
            var views = { question: 'tr-view-question', unit: 'tr-view-unit', tangen: 'tr-view-tangen' };

            Object.keys(tabs).forEach(function (key) {
                var btn = document.getElementById(tabs[key]);
                if (btn) btn.classList.toggle('active', key === type);
            });
            Object.keys(views).forEach(function (key) {
                var view = document.getElementById(views[key]);
                if (view) view.classList.toggle('active', key === type);
            });
            window.scrollTo({ top: 0 });
        }
        function trJudgeToNum(tr) {
            var el = tr.querySelector('.tr-judge-icon');
            if (!el) return 0;
            return el.classList.contains('tr-judge-correct') ? 1 : 0;
        }
        function trPctFromCell(cell) {
            if (!cell) return 0;
            var m = cell.textContent.match(/(\d+)/);
            return m ? parseInt(m[1], 10) : 0;
        }

        (function initTrResultSort() {
            var qTable = document.getElementById('tr-question-table');
            if (qTable) {
                initMultiSortTable(qTable, {
                    getTbody: function () { return document.getElementById('tr-question-body'); },
                    getRows: function () { return Array.from(document.getElementById('tr-question-body').querySelectorAll('tr')); },
                    columns: {
                        judge: { type: 'number', getValue: trJudgeToNum },
                        question: { type: 'text', getValue: function (tr) { return tr.children[1].textContent.trim(); } },
                        unit: { type: 'text', getValue: function (tr) { return tr.children[2].textContent.trim(); } },
                        atime: { type: 'number', getValue: function (tr) { return timeStrToSeconds(tr.children[3].textContent); } },
                        stime: { type: 'number', getValue: function (tr) { return timeStrToSeconds(tr.children[4].textContent); } },
                        avgrate: { type: 'number', getValue: function (tr) { return parseInt(tr.children[5].textContent, 10) || 0; } }
                    }
                });
            }

            var uTable = document.getElementById('tr-unit-table');
            if (uTable) {
                initMultiSortTable(uTable, {
                    getTbody: function () { return document.getElementById('tr-unit-body'); },
                    getRows: function () { return Array.from(document.getElementById('tr-unit-body').querySelectorAll('tr')); },
                    columns: {
                        rate: { type: 'number', getValue: function (tr) { return trPctFromCell(tr.children[0]); } },
                        unit: { type: 'text', getValue: function (tr) { return tr.children[1].textContent.trim(); } },
                        history: { type: 'text', getValue: function (tr) { return tr.children[2].textContent.trim(); } },
                        goal: { type: 'text', getValue: function (tr) { return tr.children[3].textContent.trim(); } }
                    }
                });
            }

            var tTable = document.getElementById('tr-tangen-table');
            if (tTable) {
                initMultiSortTable(tTable, {
                    getTbody: function () { return document.getElementById('tr-tangen-body'); },
                    getRows: function () { return Array.from(document.getElementById('tr-tangen-body').querySelectorAll('tr')); },
                    columns: {
                        rate: { type: 'number', getValue: function (tr) { return trPctFromCell(tr.children[0]); } },
                        tangen: { type: 'text', getValue: function (tr) { return tr.children[1].textContent.trim(); } },
                        page: { type: 'text', getValue: function (tr) { return tr.children[2].textContent.trim(); } }
                    }
                });
            }
        })();
    </script>
