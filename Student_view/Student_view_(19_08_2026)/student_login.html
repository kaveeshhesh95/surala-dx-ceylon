<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Surala i (生徒画面) - 統合プレビュー</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Style sheets -->
    <link rel="stylesheet" href="css/student.css">
</head>
<body>
    <!-- ===================== 1. ログイン画面 ===================== -->
  <div class="login-page" id="page-login">
    <div class="login-wrap">
      <div class="login-logo">
        <span class="logo-text">Surala</span>
        <span class="logo-dot">i</span>
      </div>
      <div class="login-card">
        <form id="lg-login-form" autocomplete="off" onsubmit="event.preventDefault(); document.location='student_phase1_0817_3-2_copy.html'">
        <!-- <form id="lg-login-form" autocomplete="off" onsubmit="event.preventDefault(); showPage('mokuhyou');"> -->
          <div class="field">
            <label for="lg-login-id">ログイン ID</label>
            <input type="text" id="lg-login-id" name="id" placeholder="IDを入力">
          </div>
          <div class="field">
            <label for="lg-login-pw">パスワード</label>
            <input type="password" id="lg-login-pw" name="password" placeholder="パスワードを入力">
          </div>
          <div class="login-error" id="lg-login-error"></div>
          <button type="submit" class="btn btn-primary" style="width:100%;" onclick="document.location='student_phase1_0817_3-2_copy.html'">ログイン</button>
        </form>

        <div class="divider">または</div>

        <button type="button" class="btn-oauth" onclick="document.location='student_phase1_0817_3-2_copy.html'">
        <!-- <button type="button" class="btn-oauth" onclick="showPage('mokuhyou')"> -->
          <svg viewBox="0 0 20 20">
            <path fill="#4285F4"
              d="M19.6 10.23c0-.68-.06-1.36-.18-2H10v3.79h5.4a4.6 4.6 0 0 1-2 3.02v2.5h3.23c1.9-1.75 2.97-4.33 2.97-7.31z" />
            <path fill="#34A853"
              d="M10 20c2.7 0 4.96-.9 6.62-2.44l-3.23-2.5c-.9.6-2.05.95-3.39.95-2.6 0-4.8-1.76-5.59-4.12H1.06v2.59A10 10 0 0 0 10 20z" />
            <path fill="#FBBC05" d="M4.41 11.9a6 6 0 0 1 0-3.8V5.51H1.06a10 10 0 0 0 0 8.98l3.35-2.6z" />
            <path fill="#EA4335"
              d="M10 3.98c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.6 9.6 0 0 0 10 0 10 10 0 0 0 1.06 5.51l3.35 2.6C5.2 5.75 7.4 3.98 10 3.98z" />
          </svg>
          Google でログイン
        </button>
        <button type="button" class="btn-oauth" onclick="document.location='student_phase1_0817_3-2_copy.html'">
        <!-- <button type="button" class="btn-oauth" onclick="showPage('mokuhyou')"> -->
          <svg viewBox="0 0 20 20">
            <rect width="9" height="9" x="0" y="0" fill="#F35325" />
            <rect width="9" height="9" x="11" y="0" fill="#81BC06" />
            <rect width="9" height="9" x="0" y="11" fill="#05A6F0" />
            <rect width="9" height="9" x="11" y="11" fill="#FFBA08" />
          </svg>
          Microsoft でログイン
        </button>
      </div>
    </div>
  </div>
</body>
</html>
